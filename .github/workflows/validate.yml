name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: manifests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned validator
        run: npm install --prefix "$RUNNER_TEMP/saggar-validator" --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/claude-code@2.1.302

      - name: Validate marketplace and plugin
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/saggar-validator-config
        run: |
          "$RUNNER_TEMP/saggar-validator/node_modules/.bin/claude" plugin validate --strict .claude-plugin/marketplace.json
          "$RUNNER_TEMP/saggar-validator/node_modules/.bin/claude" plugin validate --strict .claude-plugin/plugin.json
